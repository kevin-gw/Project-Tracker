<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Project Tracker</title>
<link rel="icon" type="image/x-icon" href="favicon-pm.png">
<style>
/* ================================
   COLOR SYSTEM
================================ */
:root {
  --bg-app: #f3f6fb;
  --bg-card: #ffffff;

  --primary: #4f46e5;      /* indigo */
  --primary-soft: #eef2ff;
  --accent: #0891b2;       /* teal/cyan */
  --success: #16a34a;
  --warning: #f59e0b;
  --danger: #dc2626;

  --text-main: #1f2937;
  --text-muted: #6b7280;
  --border-soft: #e5e7eb;

  --shadow-soft:
    0 1px 3px rgba(0,0,0,0.06),
    0 8px 20px rgba(0,0,0,0.07);
}

/* ================================
   BASE / RESET
================================ */
* {
  box-sizing: border-box;
}

body {
  margin: 20px;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  background:
    radial-gradient(1200px 600px at top right, #dde7ff 0%, transparent 60%),
    var(--bg-app);
  color: var(--text-main);
}

h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

button {
  cursor: pointer;
  border: none;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  color: white;
  background: linear-gradient(135deg, var(--primary), #3730a3);
  box-shadow: 0 4px 14px rgba(79,70,229,0.35);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(79,70,229,0.45);
}

button:active {
  transform: translateY(1px);
}

/* ================================
   COPY TOAST (bottom-right)
================================ */
.copy-toast {
  position: fixed;
  right: 38px;
  bottom: 18px;
  z-index: 99999;

  background: rgba(17, 24, 39, 0.92); /* dark slate */
  color: #fff;

  padding: 10px 12px;
  border-radius: 12px;

  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;

  box-shadow: 0 12px 30px rgba(0,0,0,0.25);

  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;

  transition: opacity 0.15s ease, transform 0.15s ease;
}

.copy-toast.show {
  opacity: 1;
  transform: translateY(0);
}


/* ================================
   INPUTS
================================ */
input,
textarea,
select {
  font-family: inherit;
  font-size: 13px;
  padding: 8px 10px;
  border-radius: 9px;
  border: 1px solid var(--border-soft);
  background: white;
}

.top-input{
  border: 2px solid var(--border-soft);
}

input:focus,
textarea:focus,
select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
}

textarea {
  min-height: 70px;
  resize: vertical;
}

/* ================================
   HEADER
================================ */
.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

/* Top-right "Active projects: X" badge (no gradients) */
.active-count {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.01em;

  padding: 7px 16px;
  border-radius: 999px;

  color: #1f2937;

  /* ✅ light blue background */
  background: #f5faff;
  border: 3px solid rgba(79, 70, 229, 0.22);

  box-shadow:
    0 1px 2px rgba(17, 24, 39, 0.08),
    0 6px 16px rgba(17, 24, 39, 0.08);

  position: relative;
  top: 23px;
  right: 6px;
}


/* Optional: emphasize the number only (wrap number in a span in JS/HTML) */
.active-count .count-number {
  font-weight: 800;
  color: var(--primary);
}

/* Optional hover (nice subtle microinteraction) */
/*
.active-count:hover {
  transform: translateY(-1px);
  box-shadow:
    0 3px 14px rgba(17,24,39,0.10),
    0 0 0 2px rgba(79,70,229,0.14);
  cursor: default;
}
*/


.section-header {
  margin-top: 16px;
  margin-bottom: 6px;
  padding-top:6px;

  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;

  color: var(--primary);
  border-bottom: 1px solid var(--border-soft);
}

/* ================================
   CONTROLS
================================ */
.controls {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 18px;
  border-radius: 9px;
}

.controls-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  border-radius: 9px;
}

.controls-row.full-width input#projectFilter {
  width: 100%;
}

/* ================================
   PROJECT CARD
================================ */
.project {
  background: var(--bg-card);
  padding: 14px;
  margin-bottom: 14px;
  border-radius: 16px;
  border: 1px solid var(--border-soft);
  /* transition: transform 0.12s ease, box-shadow 0.12s ease; */
  transition: box-shadow 0.18s ease, outline 0.18s ease;
  position: relative;
  background: var(--bg-card);
  padding: 14px;
  margin-bottom: 14px;
  border-radius: 16px;
  
  /* permanent outline */
  outline: 2px solid rgba(79, 70, 229, 0.45);

  /* permanent soft glow */
  box-shadow:
    0 0 0 3px rgba(79, 70, 229, 0.18),
    var(--shadow-soft);
}

.project:hover {
  transform: translateY(-1px);
  box-shadow:
    0 4px 14px rgba(0,0,0,0.08),
    0 12px 30px rgba(0,0,0,0.06);
}

.project.dragging {
  opacity: 0.5;
}

.project.archive {
  background: #f8fafc;
  opacity: 0.85;
}

/* ================================
   PROJECT TITLE
================================ */
.project strong {
  font-size: 21px;
  font-weight: 600;
}

.project-name:hover{
  cursor: text;
}

.project-description:hover{
  cursor: text;
}

.project strong.project-description{
  font-size: 14px;
  font-weight: 400;
  display: block;
  margin-top: 7px;
}

/* Project Name 2: keep a clickable area even when empty */
.project .project-name-secondary {
  display: inline-block;     /* ✅ required so min-width works */
  min-width: 220px;          /* ✅ adjust to taste (160–320px) */
  padding: 2px 6px;          /* gives a nicer hit area */
  border-radius: 8px;
}

/* Optional: make it obvious it's editable on hover */
.project .project-name-secondary:hover {
  background: rgba(79, 70, 229, 0.06);
}

/* ================================
   SMALL TEXT
================================ */
.small {
  font-size: 12px;
}


.row > label{
  font-size:14px;
}


.date-item {
  cursor: grab;
}

.date-item:active {
  cursor: grabbing;
}

.wbs-item {
  cursor: grab;
}

.wbs-item:active {
  cursor: grabbing;
  opacity: 0.85;
}

.hyperlink-item {
  cursor: grab;
}

.hyperlink-item:active {
  cursor: grabbing;
  opacity: 0.85;
}

.busops-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap; /* allows wrap on smaller screens */
}

.busops-inline {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

#busops-disciplines {
  margin-top: 13px;
}

.btn-shorter {
 padding: 5px 14px;
}

/* Subtle pill around checkbox + label text */
.chk-pill {
  display: inline-flex;
  align-items.chk-pill input[type="checkbox"] {  align-items: center;
  width: 16px;
  height: 16px;
  accent-color: var(--primary); /* modern browsers */
}

/* Disabled state (if you disable checkbox inputs) */
.chk-pill input[type="checkbox"]:disabled + span,
.chk-pill input[type="checkbox"]:disabled {
  opacity: 0.6;
}
  gap: 8px;

  padding: 6px 10px;
  border-radius: 999px;

  background: rgba(79, 70, 229, 0.06); /* soft indigo tint */
  background: #f3f4f6; /* gray-100: very light neutral */
  background: #f0f2f5; /* midpoint between #f3f4f6 and #eceff3 */
  /*background: #eceff3; /* gray-150: subtle step darker */
  /* background: #e5e7eb; /* gray-200: soft neutral (your border-soft) */
  /* background: #dde3ea; /* gray-250: slightly darker than gray-200 */
  /* background: #d1d5db; /* gray-300: noticeably darker, still subtle */
  /* background: #cbd2da; /* gray-350: chip-like background, a bit stronger */
  border: 1px solid rgba(79, 70, 229, 0.10);

  color: var(--text-main);
  font-size: 13px;

  transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}

.chk-pill:hover {
  background: rgba(79, 70, 229, 0.09);
  border-color: rgba(79, 70, 229, 0.18);
}

/* When keyboard focusing the checkbox inside the pill */
.chk-pill:focus-within {
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.18);
  border-color: rgba(79, 70, 229, 0.30);
}

/* Targets ONLY the group header strong (Training/Ops/No Group) */
.project .section-header + .row + ul.small > li > strong {
  color: var(--primary);
  font-size: 13px;
  font-weight: 700;
}

/* Project Notes: full width */
.project .project-notes {
  width: 100%;
  display: block;
  flex: 1;              /* helps if the parent row becomes flex */
  min-height: 110px;    /* optional: makes notes feel roomier */
}

/* Grid container */

/* Status areas: left-stacked flex layout that wraps */
.status-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start; /* ⬅️ keep everything stacked left */
  align-items: flex-start;
  gap: 12px 14px;              /* row gap / column gap */
}


/* Each field block (label wraps text + select) */
.status-grid > label {
  display: flex;
  flex-direction: column;
  align-items: flex-start;   /* ⬅️ left align */
  text-align: left;          /* ⬅️ left align label text */
  gap: 6px;
  margin-top: 10px;

  /* Helps create consistent “columns” while still wrapping */
  min-width: 180px;          /* tweak: 160–220 */
}

/* Fixed dropdown width so they don't expand to fill space */
.status-grid select {
  width: 170px;     /* tweak: 150–190 */
  max-width: none;
}



.hyperlink-list > li {
  margin-bottom: 3px;
}


/* Bulleted Classes */


/* Comment in and out here */

.bulleted-list{
  padding-left: 30px;
}

.bulleted-list >li{
  margin-bottom: 2px;
}


*/

/* Hyperlink row */
/* keep bullets + allow inner flex layout */
.project .hyperlink-item {
  list-style: disc;
}

/* flex ONLY the contents inside the li */
.project .hyperlink-content, .project .task-content, .project .busops-content {
  display: flex;
  align-items: center;
  gap: 6px; /* ✅ spacing between link + buttons */
}

.project .task-content > button {
  position: relative;
  top: 1px;
}


.project .small-copy{
  padding: 2px 20px;
}

/* Make sure list bullets show */
.project .task-list {
  margin: 8px 0 0;
  padding-left: 30px;           /* controls indent */
  list-style: disc;
}


/* Control bullet size for tasks */
.project .task-list > li::marker {
  font-size: 12px;
}

/* Archived projects: darker, grayer, clearly "inactive" */
.project.archive {
  /* darker gray background shading */
  background: #EEF1F2;                 /* soft gray */
  border: 1px solid #D6DBE0;           /* slightly stronger border */

  /* override the active indigo outline */
  outline: 2px solid rgba(100, 116, 139, 0.55);  /* slate outline */
  
  /* override the active glow */
  box-shadow:
    0 0 0 3px rgba(148, 163, 184, 0.20),         /* neutral ring instead of indigo */
    0 1px 3px rgba(0,0,0,0.06),
    0 8px 18px rgba(0,0,0,0.06);

  /* slightly muted */
  opacity: 0.92;
  filter: saturate(0.85);
}

/* this is the font size of the tasks which are larger than normal*/
.task-content > span{
  font-size: 15px;
}

.task-card::marker{
  font-size: 12px;
}

/* ================================
   TOOLTIP (pure CSS)
================================ */
.has-tooltip {
  position: relative; /* anchor for tooltip */
}

/* Tooltip bubble */
.has-tooltip::after {
  content: attr(data-tooltip);
  position: absolute;
  left: 50%;
  top: calc(100% + 10px);
  transform: translateX(-50%);

  background: rgba(17, 24, 39, 0.92); /* near-black */
  color: #fff;
  padding: 7px 10px;
  border-radius: 10px;

  font-size: 12px;
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;

  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s ease, transform 0.12s ease;

  box-shadow: 0 10px 24px rgba(0,0,0,0.25);
  z-index: 9999;
}

/* Tooltip little arrow */
.has-tooltip::before {
  content: "";
  position: absolute;
  left: 50%;
  top: calc(100% + 4px);
  transform: translateX(-50%);

  border: 6px solid transparent;
  border-bottom-color: rgba(17, 24, 39, 0.92);

  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s ease, transform 0.12s ease;
  z-index: 9999;
}

/* Show tooltip on hover + keyboard focus */
.has-tooltip:hover::after,
.has-tooltip:hover::before,
.has-tooltip:focus-visible::after,
.has-tooltip:focus-visible::before {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Tiny lift when appearing */
.has-tooltip:hover::after,
.has-tooltip:focus-visible::after {
  transform: translateX(-50%) translateY(2px);
}

/* Meeting duration select a bit tighter */
.meeting-duration {
  width: 120px;
  padding: 6px 8px;
}

</style>
</head>
<body>
<div class="header-row">
  <h1>Project Management Tracker</h1>
  <div id="activeCount" class="active-count">Active Projects: 0</div>
</div>

<div class="controls">
  <div class="controls-row">
    <input id="newProjectName" class="top-input" placeholder="New project name" onkeydown="if(event.key==='Enter'){ event.preventDefault(); addProject(); }" />
    <button onclick="addProject()">Add Project</button>

    <button
      id="toggleFilterBtn"
      class="has-tooltip"
      data-tooltip="Showing: Active projects only"
      onclick="toggleFilterMode()"
    >
      Show Archived Only
    </button>

    <button
      id="showAllBtn"
      class="has-tooltip"
      data-tooltip="Showing: All projects (Active + Archived)"
      onclick="showAllProjects()"
    >
      Show All
    </button>

    <button
      id="showOrpBtn"
      class="has-tooltip"
      data-tooltip="Click to show ORP-related projects only"
      onclick="showOrpProjects()"
    >
      Show ORP Related
    </button>

    <button onclick="exportData()">Export Data</button>
    <button onclick="openImportModal()">Import Data</button>
  </div>
  <div class="controls-row full-width top-input">
    <input id="projectFilter" placeholder="Filter projects..." oninput="render()" />
  </div>
</div>

<div id="projectList"></div>
<input
  type="file"
  id="importFileInput"
  accept=".json"
  style="display:none"
  onchange="handleImportFile(this.files[0])"
/>
<script>
let projects = JSON.parse(localStorage.getItem('projects') || '[]');
// viewMode: 'active' | 'archived' | 'all' | 'orp'
let viewMode = 'active';
let dragIndex = null;
let dragMember = null;
let dragTask = null;
let dragMemberProject = null;
let dragMemberIndex = null;
let dragWBSProject = null;
let dragWBSIndex = null;
let dragLinkProject = null;
let dragLinkIndex = null;


function render() {
  const filter = document.getElementById('projectFilter').value.trim().toLowerCase();

  document.getElementById('activeCount').innerText =
    `Active Projects: ${projects.filter(p => !p.archived).length}`;

  projects.forEach(p => {
    if (!Array.isArray(p.members)) p.members = [];
    if (!Array.isArray(p.wbs)) p.wbs = [];
    if (!Array.isArray(p.hyperlinks)) p.hyperlinks = [];
    if (!Array.isArray(p.tasks)) p.tasks = [];
    if (!Array.isArray(p.dates)) p.dates = [];
    if (typeof p.orpRelated !== 'boolean') p.orpRelated = false
    
    p.members.forEach(m => {
      if (!Array.isArray(m.groups)) m.groups = [];
    });
  });


  const container = document.getElementById('projectList');
  container.innerHTML = '';

  projects.forEach((_, i) => {
  const p = projects[i]; // ✅ force fresh state reference
    // Filter based on viewMode
    if (viewMode === 'active' && p.archived) return;
    if (viewMode === 'archived' && !p.archived) return;
    if (viewMode === 'orp' && !p.orpRelated) return;
    // viewMode === 'all' shows everything

    if (filter && !p.name.toLowerCase().includes(filter)) return;

    const div = document.createElement('div');
    div.className = 'project' + (p.archived?' archive':'');
    div.draggable = true;

    div.ondragstart = ()=>{ dragIndex=i; div.classList.add('dragging'); };
    div.ondragend = ()=> div.classList.remove('dragging');
    div.ondragover = e=>e.preventDefault();
    div.ondrop = ()=>{
      const temp = projects[dragIndex];
      projects.splice(dragIndex,1);
      projects.splice(i,0,temp);
      save(); render();
    };
div.innerHTML = `
  <div
    style="
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    "
  >
    <!-- Project Name -->
    <strong
      contenteditable="false"
      class="project-name"
      ondblclick="enableNameEdit(this)"
      onkeydown="handleNameKey(event, ${i}, this)"
      onblur="saveNameEdit(${i}, this)"
      style="white-space: nowrap; cursor: text;"
    >
      ${p.name}
    </strong>

    <!-- Separator -->
    <span style="color:var(--border-soft); font-weight:600;">│</span>

    <!-- Project Name 2 -->
    <strong
      contenteditable="false"
      class="project-name project-name-secondary"
      ondblclick="enableName2Edit(this)"
      onkeydown="handleName2Key(event, ${i}, this)"
      onblur="saveName2Edit(${i}, this)"
      style="white-space:nowrap;"
    >
      ${p.name2 || ''}
    </strong>

    <!-- FLEX SPACER -->
    <div style="flex: 1;"></div>

    <!-- Active Indicator -->
    <span
      class="small"
      style="
        font-size:14px;
        white-space:nowrap;
        padding:4px 11px;
        border-radius:999px;
        font-weight:600;
        background:${p.archived
          ? 'rgba(220,38,38,0.15)'
          : 'rgba(22,163,74,0.15)'};
        color:${p.archived
          ? '#dc2626'
          : '#16a34a'};
      "
    >
      ${p.archived ? 'Archived' : 'Active'}
    </span>


    <!-- Separator -->
    <span style="color:var(--border-soft); font-weight:600;">│</span>

    <!-- Archive/Delete Buttons -->
    <div style="display:flex; gap:10px; white-space:nowrap;">

      <!-- Archive/Restore -->
      <button onclick="toggleArchive(${i})"
              style="font-size:13px; padding:5px 11px;">
        ${p.archived ? 'Restore' : 'Archive'}
      </button>

      <!-- Delete -->
      <button onclick="deleteProject(${i})"
              style="font-size:13px; padding:5px 11px;">
        Delete
      </button>

    </div>

  </div>

  <!-- Project Description -->
  <strong
    contenteditable="false"
    class="project-description"
    ondblclick="enableDescriptionEdit(this)"
    onkeydown="handleDescriptionKey(event, ${i}, this)"
    onblur="saveDescriptionEdit(${i}, this)"
  >
    ${p.description || 'Project objectives / description'}
  </strong>


  <!-- BusOps Disciplines -->
  <div class="row">
      <div class="section-header" id="busops-disciplines">BusOps Disciplines</div>
  <div class="row">

  <div class="busops-row">

    <!-- Discipline Selection -->
    <select id="busOpsDiscipline-${i}">
      <option value="">Select</option>
      <option>None</option>
      <option>Publications</option>
      <option>Training</option>
    </select>

    <!-- Add Discipline -->
    <button class="btn-shorter" onclick="addBusOpsDiscipline(${i})">
      Add Discipline
    </button>

    
    <label class="chk-pill" style="display:flex; align-items:center; gap:6px;">
      <!-- ConfirmedCheckbox -->
      <input
        type="checkbox"
        ${p.confirmedBusOpsDisciplines ? 'checked' : ''}
        onchange="
          updateField(${i}, 'confirmedBusOpsDisciplines', this.checked);
          render();
        "
      >
      Confirmed BusOps Disciplines
    </label>

    <!-- Confirmation Date -->
    <label style="display:flex; align-items:center; gap:6px;">
      <span class="small">Date: </span>
      <input
        type="date"
        ${!p.confirmedBusOpsDisciplines ? 'disabled' : ''}
        value="${p.busOpsDisciplineConfirmedDate || ''}"
        onchange="updateField(${i}, 'busOpsDisciplineConfirmedDate', this.value)"
      >
    </label>

    <!-- Confirmed By -->
    <label style="display:flex; align-items:center; gap:6px;">
      <span class="small">Confirmed By</span>
      <select
        ${!p.confirmedBusOpsDisciplines ? 'disabled' : ''}
        onchange="updateField(${i}, 'busOpsDisciplineConfirmedBy', this.value)"
      >
        ${memberOptions(p, p.busOpsDisciplineConfirmedBy)}
      </select>
    </label>
  </div>


  <!-- Bulleted Disciplines -->
  <ul class="small small-bulleted-disciplines bulleted-list">
    ${(p.busOpsDisciplines || []).map((d, idx) => `
      <li
        draggable="true"
        ondragstart="disciplineDragStart(${i}, ${idx})"
        ondragend="disciplineDragEnd()"
        ondragover="event.preventDefault()"
        ondrop="disciplineDrop(${i}, ${idx})"
      >
      <span class="busops-content">
        ${d.type}

        <button onclick="editBusOpsDiscipline(${i}, ${idx})"
                style="font-size:11px; padding:2px 6px;">
          ✏️
        </button>

        <button onclick="deleteBusOpsDiscipline(${i}, ${idx})"
                style="font-size:11px; padding:2px 6px;">
          🗑️
        </button>
      </span>
      </li>
    `).join('')}
  </ul>

  <!-- Overall Project Status -->
  <div class="section-header">Overall Project Status</div>

  <div class="row status-grid">

    <label>
      Project Phase
      <select onchange="updateField(${i}, 'projectPhase', this.value)">
        <option value="" ${!p.projectPhase ? 'selected' : ''}>Select</option>
        ${['Initiating','Planning','Executing','Delivering','Closing'].map(ph => `
          <option value="${ph}" ${p.projectPhase === ph ? 'selected' : ''}>
            ${ph}
          </option>
        `).join('')}
      </select>
    </label>

    <label>
      Project State
      <select onchange="updateField(${i}, 'state', this.value)">
        <option value="" ${!p.state ? 'selected' : ''}>Select</option>

function normalizeProjects() {
  projects.forEach(p => {
    // Ensure members array exists
    if (!Array.isArray(p.members)) p.members = [];

    // Role fields
    p.primaryVendor ??= '';
    p.taskStage ??= '';
    p.itmoPM ??= '';
    p.busOpsPM ??= '';
    p.programRequester ??= '';
    p.itAnalyst ??= '';
    p.cammiManager ??= '';
    p.businessAnalyst ??= '';
    p.testAnalyst ??= '';
    // project fields
    p.name2 ??= '';
    p.busOpsDisciplines ??= [];
    p.confirmedBusOpsDisciplines ??= false;
    p.busOpsDisciplineConfirmedDate ??= '';
    p.busOpsDisciplineConfirmedBy ??= '';
    p.projectPhase ??= '';
  });

  save();
}

function normalizeGroupName(name) {
  return name.trim().replace(/\s+/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}

function normalizeGroupKey(name) {
  return normalizeGroupName(name).toLowerCase();
}

function handleMemberEnter(projectIndex, event) {
  if (event.key !== 'Enter') return;

  event.preventDefault();

  const nameInput = document.getElementById(`mname-${projectIndex}`);
  const emailInput = document.getElementById(`memail-${projectIndex}`);
  const groupsInput = document.getElementById(`mgroups-${projectIndex}`);

  const name = nameInput.value.trim();
  const email = emailInput.value.trim();
  const groups = groupsInput.value.trim();

  // Only add if ANY field has content
  if (!name && !email && !groups) return;

  addMember(projectIndex, name, email, groups);

  // Clear inputs after add
  nameInput.value = '';
  emailInput.value = '';
  groupsInput.value = '';

  // Put cursor back in name field for fast entry
  nameInput.focus();
}

function addMember(i, name, email, groups) {
  const finalName = name && name.trim() ? name.trim() : 'No Name';
  const finalEmail = email && email.trim() ? email.trim() : 'No Email';

  // If literally nothing was entered anywhere, do nothing
  if (finalName === 'No Name' && finalEmail === 'No Email' && !groups?.trim()) {
    return;
  }

  projects[i].members.push({
    name: finalName,
    email: finalEmail,
    groups: groups
      ? groups.split(',')
          .map(normalizeGroupName)
          .filter(Boolean)
          .filter((g, idx, arr) =>
            arr.findIndex(x => normalizeGroupKey(x) === normalizeGroupKey(g)) === idx
          )
      : [],
    includeInEmail: finalEmail !== 'No Email'
  });

  save();
  render();
}

function deleteMember(projectIndex, memberIndex) {
  projects[projectIndex].members.splice(memberIndex, 1);
  save();
  render();
}

function toggleIncludeInEmail(projectIndex, memberIndex) {
  projects[projectIndex].members[memberIndex].includeInEmail = !projects[projectIndex].members[memberIndex].includeInEmail;
  save();
  render();
}

function editMember(projectIndex, memberIndex) {
  const member = projects[projectIndex].members[memberIndex];
  const name = prompt("Edit member name", member.name);
  if (name === null) return;

  const email = prompt("Edit member email", member.email);
  if (email === null) return;

  const groups = prompt("Edit groups (comma separated)", (member.groups || []).join(", "));
  if (groups === null) return;

  member.name = name.trim() || member.name;
  member.email = email.trim() || member.email;
  member.groups = groups
    ? groups.split(",")
        .map(normalizeGroupName)
        .filter(Boolean)
        .filter((g, idx, arr) => arr.findIndex(x => normalizeGroupKey(x) === normalizeGroupKey(g)) === idx)
    : [];
  save();
  render();
}

function copyEmail(projectIndex, memberIndex) {
  const member = projects[projectIndex].members[memberIndex];
  if (!member || !member.email) return;

  navigator.clipboard.writeText(member.email)
    .then(() => showCopyToast('Email copied'))
    .catch(() => showCopyToast('Copy failed'));
}

function copyGroupEmails(projectIndex, group) {
  const key = normalizeGroupKey(group);
  const members = projects[projectIndex].members.filter(m =>
    (m.groups || []).some(g => normalizeGroupKey(g) === key) && m.includeInEmail
  );

  const emails = members.map(m => m.email).join('; ');
  navigator.clipboard.writeText(emails)
    .then(() => showCopyToast('Group emails copied'))
    .catch(() => showCopyToast('Copy failed'));
}


function showCopyToast(message = 'Copied!') {
  let toast = document.getElementById('copyToast');

  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'copyToast';
    toast.className = 'copy-toast';
    document.body.appendChild(toast);
  }

  toast.textContent = message;
  toast.classList.add('show');

  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => {
    toast.classList.remove('show');
  }, 1500);
}

function exportData() {
  const data = {
    projects,
    exportDate: new Date().toISOString()
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], {
    type: 'application/json'
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  const date = new Date().toISOString().replace(/[:.]/g, '-');
  a.href = url;
  a.download = `project-tracker-backup-${date}.json`;

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}


function handleImportFile(file) {
  if (!file) return;

  if (!confirm('Importing this file will overwrite all existing projects. Continue?')) {
    return;
  }

  const reader = new FileReader(); // ✅ FIXED

  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);

      if (!data.projects || !Array.isArray(data.projects)) {
        alert('Invalid file format. Missing projects array.');
        return;
      }

      projects = data.projects;
      save();
      render();
      showCopyToast('Data imported successfully');
    } catch (err) {
      alert('Failed to import file: ' + err.message);
    }
  };

  reader.readAsText(file);
}

  save();
  render();

function editProjectDate(projectIndex, dateIndex) {

  let type = prompt(
    "Edit Date Type (OCC Letter, Start Date, End Date, Kickoff Meeting, SIT, UAT, PROD, or Blank)",
    date.type
  );
  if (type === null) return;

  type = type.trim();
  if (!['OCC Letter','Start Date', 'End Date', 'Kickoff Meeting','SIT','UAT','PROD','Blank'].includes(type)) {
    alert('Invalid date type.');
    return;
  }

  const value = prompt("Edit Date (YYYY-MM-DD)", date.value);
  if (value === null) return;

  date.type = type;
  date.value = value.trim() || date.value;
  save();
  render();
}

  if (!isoDate) return '';
  const [y, m, d] = isoDate.split('-');
  return `${parseInt(m,10)}/${parseInt(d,10)}/${y}`;

function enableNameEdit(el) {
  el.contentEditable = "true";
  el.focus();

  // Move caret exactly where user double-clicked
  const range = document.createRange();
  const sel = window.getSelection();
  range.selectNodeContents(el);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}

function handleNameKey(event, projectIndex, el) {
  if (event.key === 'Enter') {
    event.preventDefault();
    el.blur(); // triggers saveNameEdit
  }
}

function saveNameEdit(projectIndex, el) {
  el.contentEditable = "false";

  const value = el.innerText.trim();
  if (!value) {
    el.innerText = projects[projectIndex].name; // revert if empty
    return;
  }

  projects[projectIndex].name = value;
  save();
}

function updateArchiveToggleTooltip() {

  }

function showCopyToast(message = 'Copied!') {
  let toast = document.getElementById('copyToast');

  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'copyToast';
    toast.className = 'copy-toast';
    document.body.appendChild(toast);
  }

  toast.textContent = message;
  toast.classList.add('show');

  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => {
    toast.classList.remove('show');
  }, 1500);
}

function updateViewButtonsAndTooltips() {
  const toggleBtn = document.getElementById('toggleFilterBtn');
  const showAllBtn = document.getElementById('showAllBtn');
  const showOrpBtn = document.getElementById('showOrpBtn');

  if (!toggleBtn || !showAllBtn || !showOrpBtn) return;

  // Toggle button ONLY switches between active-only and archived-only
  if (viewMode === 'active') {
    toggleBtn.textContent = 'Show Archived Only';
    toggleBtn.dataset.tooltip = 'Showing: Active projects only';
  } else if (viewMode === 'archived') {
    toggleBtn.textContent = 'Show Active Only';
    toggleBtn.dataset.tooltip = 'Showing: Archived projects only';
  } else if (viewMode === 'all') {
    toggleBtn.textContent = 'Show Archived Only';
    toggleBtn.dataset.tooltip = 'Showing: All projects (Active + Archived)';
  } else if (viewMode === 'orp') {
    toggleBtn.textContent = 'Show Archived Only';
    toggleBtn.dataset.tooltip = 'Showing: ORP-related projects only';
  }

  // Show All button
  if (viewMode === 'all') {
    showAllBtn.dataset.tooltip = 'Showing: All projects (Active + Archived)';
  } else {
    showAllBtn.dataset.tooltip = 'Click to show all projects (Active + Archived)';
  }

  // Show ORP button
  if (viewMode === 'orp') {
    showOrpBtn.dataset.tooltip = 'Showing: ORP-related projects only';
  } else {
    showOrpBtn.dataset.tooltip = 'Click to show ORP-related projects only';
  }
}

function showOrpProjects() {
  viewMode = 'orp';
  updateViewButtonsAndTooltips();
  render();
}

function formatDurationLabel(minutes) {
  const m = parseInt(minutes, 10) || 0;
  if (!m) return '';
  if (m === 60) return '1 hour';
  if (m % 60 === 0) return `${m / 60} hours`;
  return `${m} mins`;
}
